name: Backend release parity
on:
  pull_request:
    branches: [development]
    paths: ['supabase/**', 'scripts/**', '.github/workflows/backend-parity.yml', 'package.json', 'AGENTS.md']
  push:
    branches: [development]
    paths: ['supabase/**', 'scripts/**', '.github/workflows/backend-parity.yml', 'package.json', 'AGENTS.md']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: Orbitoshopv2-v1
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: zaighaumrana/orbito
          # Immutable compatible Platform snapshot: valid before/during/after
          # merges and feature-branch retirement; private access is CI-only.
          ref: de17a52ae750c3aa08554b577769df43f6e84eac
          path: orbito
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.RETRASELL_RELEASE_READ_TOKEN || github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify approved support-v9 and supported historical releases
        working-directory: orbito
        run: node scripts/release-parity.mjs
